name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000/graphql
          NEXT_PUBLIC_SUPABASE_URL: https://zvgymgxcmxupxhscnlfo.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp2Z3ltZ3hjbXh1cHhoc2NubGZvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzI5MDI5NzUsImV4cCI6MjA4ODQ3ODk3NX0.Ped7dckop76J-kQA9n4uMmSRabovrumekx8pCE9hhcY

  backend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    # マイグレーションの検査で使う使い捨てのDB（シャドーDB）
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # schema.prisma を変えたのにマイグレーションを作り忘れていないか
      - name: Check migrations match schema
        run: >-
          npx prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://postgres:ci@localhost:5432/postgres
          --exit-code
        env:
          DATABASE_URL: postgresql://postgres:ci@localhost:5432/postgres
          DIRECT_URL: postgresql://postgres:ci@localhost:5432/postgres

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
